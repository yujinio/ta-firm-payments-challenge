services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firm_payments
    # Host ports are set by DB_PORT and LB_PORT; host-side tests follow DB_PORT.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firm_payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: firm-payments
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/firm_payments
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: firm-payments
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/firm_payments
    deploy:
      replicas: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  lb:
    image: nginx:stable
    ports:
      - "127.0.0.1:${LB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
